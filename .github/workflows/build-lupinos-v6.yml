name: Build & Package Lupin Bare-Metal OS v6

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/build-lupinos-v6.yml'
  workflow_dispatch:
    inputs:
      base_boot_url:
        description: 'URL direta para download da imagem boot base (opcional)'
        required: false
        default: ''

jobs:
  build-lupinos-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross musl-tools python3 cpio gzip curl
          # Instalar avbtool oficial do AOSP
          curl -s https://android.googlesource.com/platform/external/avb/+/master/avbtool.py?format=TEXT | base64 -d > avbtool
          chmod +x avbtool
          sudo mv avbtool /usr/local/bin/

      - name: Compile Sovereign C Binaries (AArch64 Static)
        run: |
          CC=aarch64-linux-gnu-gcc make clean
          CC=aarch64-linux-gnu-gcc make
          mkdir -p bin
          cp build/lupinos_guard bin/lupinos_guard
          cp build/drm_subdisplay bin/lupin_subdisplay_hud
          cp build/lupin-power bin/lupin-power
          cp build/lupinctl bin/lupinctl
          cp build/lupin_slot_ctl bin/lupin_slot_ctl
          ls -lh bin/
          file bin/*

      - name: Run Host-Runnable Tests
        run: |
          cargo test --manifest-path crates/lupinos-daemon/Cargo.toml
          chmod +x tools/test_sovereign_control.sh
          ./tools/test_sovereign_control.sh

      - name: Assemble Sovereign v6 Boot Image
        if: ${{ inputs.base_boot_url != '' }}
        run: |
          curl -L -o base_boot.img "${{ inputs.base_boot_url }}"
          python3 tools/build_os_v6.py \
            --boot base_boot.img \
            --guardian bin/lupinos_guard \
            --hud bin/lupin_subdisplay_hud \
            --power bin/lupin-power \
            --lupinctl bin/lupinctl \
            --slot-ctl bin/lupin_slot_ctl \
            --out lupin_baremetal_star_v6_sovereign.img
          sha256sum lupin_baremetal_star_v6_sovereign.img > sha256_image.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lupinos-v6-artifacts
          path: |
            bin/*
            lupin_baremetal_star_v6_sovereign.img
            sha256_image.txt
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/*
            lupin_baremetal_star_v6_sovereign.img
            sha256_image.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
